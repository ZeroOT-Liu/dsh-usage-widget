# Publishes the installable bundle whenever a version tag is pushed.
#
# The release asset is deliberately renamed to `dsh-usage-widget.tgz` so that
# the stable `releases/latest/download/dsh-usage-widget.tgz` URL keeps working
# across versions — that URL is what the README tells users to install from.
#
# Release notes come from `release-notes/<tag>.md`. `--generate-notes` is
# deliberately not used: it only lists merged pull requests, so a repository
# that tags commits directly would publish an empty body — and it would
# override the annotated tag message, which serves as the fallback.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish or re-publish'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual run publishes an existing tag, so check that ref out.
          # Full history and tags are needed by the tag-message fallback.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify before publishing
        run: |
          node --check index.js
          node --check client.js
          for file in lib/*.js; do node --check "$file"; done
          node test/run-tests.mjs
          node test/client-smoke.mjs

      - name: Pack the bundle
        run: |
          npm pack
          mv dsh-usage-widget-*.tgz dsh-usage-widget.tgz
          tar -tzf dsh-usage-widget.tgz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # INPUT_TAG is passed through the environment rather than inlined, so
          # a tag name can never be read as shell syntax.
          set -euo pipefail
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          NOTES="release-notes/${TAG}.md"
          NOTES_ARGS=()
          if [ -f "$NOTES" ]; then
            echo "using release notes from $NOTES"
            NOTES_ARGS=(--notes-file "$NOTES")
          else
            # A tag can predate its own notes file (notes are often written
            # after the fact, or a manual run re-publishes an older tag), so
            # look on the default branch before giving up on the file.
            BRANCH="${GITHUB_DEFAULT_BRANCH:-main}"
            if git fetch --depth=1 origin "$BRANCH" >/dev/null 2>&1 && git show "FETCH_HEAD:${NOTES}" > /tmp/release-notes.md 2>/dev/null; then
              echo "using release notes from ${BRANCH}:${NOTES}"
              NOTES_ARGS=(--notes-file /tmp/release-notes.md)
            fi
          fi
          if [ ${#NOTES_ARGS[@]} -eq 0 ]; then
            echo "no ${NOTES} anywhere; falling back to the annotated tag message"
            TAG_MESSAGE="$(git tag -l --format='%(contents)' "$TAG" || true)"
            if [ -n "${TAG_MESSAGE//[[:space:]]/}" ]; then
              NOTES_ARGS=(--notes "$TAG_MESSAGE")
            else
              # Never publish an empty body. Built with printf on one line: a
              # multi-line literal here would dedent to column 0 and break the
              # `run: |` block scalar.
              NOTES_ARGS=(--notes "$(printf 'Published %s.\n\nInstall:\n\n    dsh plugin --profile desktop add "%s"\n' "$TAG" "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/dsh-usage-widget.tgz")")
            fi
          fi

          # Idempotent: re-publishing replaces the asset and the notes instead
          # of failing. GitHub also turns a release into a draft when its tag is
          # deleted and recreated, so an existing release is un-drafted here —
          # `releases/latest/download/...` only resolves for published releases.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dsh-usage-widget.tgz --clobber
            gh release edit "$TAG" "${NOTES_ARGS[@]}" --draft=false
          else
            gh release create "$TAG" dsh-usage-widget.tgz \
              --title "$TAG" \
              "${NOTES_ARGS[@]}"
          fi
