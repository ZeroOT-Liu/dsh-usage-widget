# Publishes the installable bundle whenever a version tag is pushed.
#
# The release asset is deliberately renamed to `dsh-usage-widget.tgz` so that
# the stable `releases/latest/download/dsh-usage-widget.tgz` URL keeps working
# across versions — that URL is what the README tells users to install from.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify before publishing
        run: |
          node --check index.js
          node --check client.js
          for file in lib/*.js; do node --check "$file"; done
          node test/run-tests.mjs
          node test/client-smoke.mjs

      - name: Pack the bundle
        run: |
          npm pack
          mv dsh-usage-widget-*.tgz dsh-usage-widget.tgz
          tar -tzf dsh-usage-widget.tgz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes come from release-notes/<tag>.md when it exists.
          # `--generate-notes` is deliberately not used: it only lists merged
          # pull requests, so a repository that tags commits directly would
          # publish an empty body — and it would override the annotated tag
          # message, which is otherwise used as the fallback.
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES="release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            echo "using release notes from $NOTES"
            NOTES_ARGS=(--notes-file "$NOTES")
          else
            echo "no $NOTES; falling back to the annotated tag message"
            NOTES_ARGS=(--notes "$(git tag -l --format='%(contents)' "$TAG")")
          fi

          # Idempotent: re-pushing a tag replaces the asset and the notes
          # instead of failing. GitHub also turns a release into a draft when
          # its tag is deleted and recreated, so an existing release is
          # un-drafted here — `releases/latest/download/...` only resolves for
          # published releases.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dsh-usage-widget.tgz --clobber
            gh release edit "$TAG" "${NOTES_ARGS[@]}" --draft=false
          else
            gh release create "$TAG" dsh-usage-widget.tgz \
              --title "$TAG" \
              "${NOTES_ARGS[@]}"
          fi
